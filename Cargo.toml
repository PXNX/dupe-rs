[package]
name = "dupe-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = "0.36.2"
egui_material_icons = { version = "0.8.0", features = ["compressed"] }
humansize = "2.1.3"
image = "0.25.10"
open = "5.4.4"
rayon = "1.12.0"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
trash = "5.2.9"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe"] }
filetime = "0.2.29"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"
