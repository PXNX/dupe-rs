name: Release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets

  build:
    name: Build release binary
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/dupe-rs.exe dist/dupe-rs.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dupe-rs-windows
          path: dist/dupe-rs.exe

      # A push to master publishes `v<Cargo.toml version>` the first time that
      # version is seen, so bumping `version` in Cargo.toml is all a release
      # takes. Pushing a `v*.*.*` tag by hand still works too.
      - name: Decide release tag
        id: release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
            $tag = "v$version"
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists; bump the version in Cargo.toml to publish a new one."
              $tag = ""
            }
            $global:LASTEXITCODE = 0
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/dupe-rs.exe
          generate_release_notes: true
